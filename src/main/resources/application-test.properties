
# Separate H2 database for automated tests
spring.datasource.url=jdbc:h2:mem:secondserve-test;MODE=MySQL;DB_CLOSE_DELAY=-1;DATABASE_TO_LOWER=TRUE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Create a fresh test schema
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

# Disable SQL initialization scripts
spring.sql.init.mode=never

# Keep test logs readable
spring.jpa.show-sql=false
